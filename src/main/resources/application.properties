quarkus.application.name=nationalparks

# The backend builds its own MongoDB connection string from the properties below.
# OpenShift injects them as MONGODB_SERVER_HOST, MONGODB_SERVER_PORT, MONGODB_USER,
# MONGODB_PASSWORD and MONGODB_DATABASE (see the "Connecting to a Database" module
# of the workshop). SmallRye Config maps those environment variables onto the dotted
# names below, the same way Spring Boot's relaxed binding used to.
mongodb.server.host=127.0.0.1
mongodb.server.port=27017
mongodb.user=mongodb
mongodb.password=mongodb
mongodb.database=mongodb

# The connection is opened by MongoDBConnection, not by the extension's default
# client, so neither its health check nor Dev Services should kick in.
quarkus.mongodb.health.enabled=false
quarkus.mongodb.devservices.enabled=false

# /ws/data/* was annotated with Spring's @CrossOrigin
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

# The S2I java builder image copies a single target/*.jar into the image and starts
# it with "java -jar", so the default fast-jar layout (target/quarkus-app/) will not
# work. An uber-jar keeps that contract: target/nationalparks-runner.jar
quarkus.package.jar.type=uber-jar
